<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>그림 터치 문진표 - 정확히 어디인가요?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <button id="btn-back" class="btn btn-secondary">
      <span class="icon">◀</span> <span class="text" data-i18n="btn_prev">이전</span>
    </button>
    <div id="progress-bar"><div id="progress-fill" style="width: 20%;"></div><span id="progress-text">1 / 5</span></div>
    <button id="btn-nurse-lock" class="btn-icon">🔒</button>
  </header>

  <section class="step active">
    <h1 class="speakable"><span id="title-span" data-i18n="step_1_title">어디가 아파요?</span><button class="btn-speaker">🔊</button></h1>
    
    <!-- Head Position Overlay -->
    <div id="head-pos-flow" class="hidden hurt-flow">
      <div class="symptoms-grid single-select">
        <button class="symptom-card" data-sub="part_head"><span class="emoji">🧑</span><span class="text" data-i18n="part_head">머리</span></button>
        <button class="symptom-card" data-sub="part_neck"><span class="emoji">🦒</span><span class="text" data-i18n="part_neck">목</span></button>
        <button class="symptom-card" data-sub="part_eye"><span class="emoji">👁️</span><span class="text" data-i18n="part_eye">눈</span></button>
        <button class="symptom-card" data-sub="part_ear"><span class="emoji">👂</span><span class="text" data-i18n="part_ear">귀</span></button>
        <button class="symptom-card" data-sub="part_nose"><span class="emoji">👃</span><span class="text" data-i18n="part_nose">코</span></button>
        <button class="symptom-card" data-sub="part_mouth"><span class="emoji">👄</span><span class="text" data-i18n="part_mouth">입·이</span></button>
      </div>
    </div>

    <!-- Side (Left/Right/Both) Selection Overlay -->
    <div id="side-select-flow" class="hidden hurt-flow">
      <div class="symptoms-grid single-select">
        <button class="symptom-card" data-side="left"><span class="emoji">👈</span><span class="text" data-i18n="side_left">왼쪽</span></button>
        <button class="symptom-card" data-side="right"><span class="emoji">👉</span><span class="text" data-i18n="side_right">오른쪽</span></button>
        <button class="symptom-card" data-side="both"><span class="emoji">🙌</span><span class="text" data-i18n="side_both">양쪽 다</span></button>
      </div>
    </div>
    
    <!-- Leg Part Selection Overlay -->
    <div id="leg-part-flow" class="hidden hurt-flow">
      <div class="symptoms-grid single-select">
        <button class="symptom-card" data-sub="leg_thigh"><span class="emoji">🦵</span><span class="text" data-i18n="leg_thigh">허벅지</span></button>
        <button class="symptom-card" data-sub="leg_knee"><span class="emoji">🦵</span><span class="text" data-i18n="leg_knee">무릎</span></button>
        <button class="symptom-card" data-sub="leg_calf"><span class="emoji">🦵</span><span class="text" data-i18n="leg_calf">종아리·발목</span></button>
        <button class="symptom-card" data-sub="leg_foot"><span class="emoji">🦶</span><span class="text" data-i18n="leg_foot">발</span></button>
      </div>
    </div>

    
    <!-- Belly Position Overlay -->
    <div id="belly-pos-flow" class="hidden hurt-flow" style="position: relative; width: 100%; max-width: 400px; margin: 0 auto; display: flex; flex-direction: column; align-items: center;">
      <!-- Labels -->
      <div class="belly-label label-left">
        <span class="label-text" data-i18n="side_left">왼쪽</span><br><span class="label-icon">🖐️</span>
      </div>
      <div class="belly-label label-right">
        <span class="label-text" data-i18n="side_right">오른쪽</span><br><span class="label-icon">🤚</span>
      </div>
      
      <!-- Container -->
      <div id="belly-container" style="position: relative; width: 100%; aspect-ratio: 1472/1496; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); background: #fff;">
        <img src="qhrqn.png" alt="Belly" style="width: 100%; height: 100%; display: block; pointer-events: none; user-select: none;" draggable="false" />
        
        <svg id="belly-svg" viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
          <style>
            .belly-area { fill: transparent; stroke: rgba(156, 163, 175, 0.8); stroke-width: 0.5; stroke-dasharray: 1, 1; transition: fill 0.2s, stroke 0.2s; pointer-events: all; cursor: pointer; }
            .belly-area.highlight { fill: rgba(255, 107, 107, 0.5); stroke: rgba(255, 107, 107, 1); stroke-width: 1.5; stroke-dasharray: none; }
            .belly-area.highlight-danger { fill: rgba(239, 68, 68, 0.5); stroke: var(--emergency); stroke-width: 1.5; stroke-dasharray: none; }
          </style>
          <!-- 구역은 아래 스크립트가 그림 (중고등 3x3 9칸, 초등은 이 화면을 쓰지 않음) -->
        </svg>
      </div>
      
            <div style="margin-top: 1rem; display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
        <button id="btn-belly-done" class="btn btn-primary" style="display: none; width: 100%;" data-i18n="btn_confirm">확인 ✔️</button>
      </div>
    </div>


    <div class="step-actions" style="justify-content: center;">
      <button class="btn btn-secondary btn-idk" data-i18n="idk">잘 모르겠어요</button>
    </div>
  </section>

  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let state = getState();
      const cur = state.current;
      if (!cur) { window.location.href = 'step1.html'; return; }

      function updateTitle(i18nKey) {
        const span = document.getElementById('title-span');
        span.setAttribute('data-i18n', i18nKey);
        applyLanguageToUI();
      }

      const showFlow = (id) => {
        document.querySelectorAll('.hurt-flow').forEach(el => el.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
      };

      // Flow Logic
      const lang = state.lang || 'ko';
      const t = translations[lang] || translations.ko;

      // 세부 부위를 고르면 이번 회차 대기열·답을 비우고 새로 시작 (step2에서 돌아온 경우 포함)
      if (cur.sub.side && !cur.sub.sideSelected) {
        // 다리: 왼쪽/오른쪽 선택
        updateTitle('side_select_leg');
        showFlow('side-select-flow');

        document.querySelectorAll('[data-side]').forEach(btn => {
          btn.onclick = (e) => {
            const side = e.currentTarget.dataset.side;
            cur.sub.sideLabel = translations.ko['side_' + side];
            cur.sub.legSide = side;
            cur.sub.sideSelected = true;
            saveState(state);
            location.reload();
          };
        });
      } else if (cur.sub.side === 'leg' && cur.sub.sideSelected) {
        // 다리: 세부 부위 선택
        updateTitle('step_1_title');
        showFlow('leg-part-flow');
        document.querySelectorAll('#leg-part-flow [data-sub]').forEach(btn => {
          btn.onclick = (e) => {
            const subKey = e.currentTarget.dataset.sub;
            restartRound(cur);
            cur.sub.legSub = subKey;
            cur.part = legPartLabel(cur.sub.legSide, subKey);
            saveState(state);
            window.location.href = 'step2.html';
          };
        });
      } else if (cur.part === translations.ko['part_head'] && !cur.sub.headSub) {
        // Head Sub Selection
        updateTitle('part_head');
        showFlow('head-pos-flow');
        document.querySelectorAll('#head-pos-flow [data-sub]').forEach(btn => {
          btn.onclick = (e) => {
            const subKey = e.currentTarget.dataset.sub;
            restartRound(cur);
            cur.part = translations.ko[subKey];
            cur.sub.headSub = true;
            saveState(state);
            window.location.href = 'step2.html';
          };
        });
      } else if (cur.part === translations.ko['part_belly'] && state.level !== 'secondary') {
        // 초등은 배를 나누지 않음 ('배' 하나로 증상 화면으로)
        window.location.href = 'step2.html';
        return;
      } else if (cur.part === translations.ko['part_belly']) {
        // 중고등: 배 9칸 (3x3)
        updateTitle('part_belly');
        showFlow('belly-pos-flow');

        // 배 구역 줄 (위에서 아래로, 각 줄은 왼쪽에서 오른쪽으로)
        // 모서리 4칸은 예전 2x2와 같은 키라서 충수염 판단(belly_right_bottom)이 그대로 동작
        const BELLY_ROWS = [
          { cells: ['belly_left_top', 'belly_center_top', 'belly_right_top'], allId: 'belly_top_all', allName: '윗배 전체', multiId: 'belly_top_multi', lookup: '윗배' },
          { cells: ['belly_left_mid', 'belly_navel', 'belly_right_mid'], allId: 'belly_mid_all', allName: '배꼽 높이 전체', multiId: 'belly_mid_multi', lookup: '배' },
          { cells: ['belly_left_bottom', 'belly_center_bottom', 'belly_right_bottom'], allId: 'belly_bottom_all', allName: '아랫배 전체', multiId: 'belly_bottom_multi', lookup: '아랫배' }
        ];

        // 그림 위에 구역 그리기
        const bellySvg = document.getElementById('belly-svg');
        const cellH = 100 / BELLY_ROWS.length;
        BELLY_ROWS.forEach((row, ri) => {
          const cellW = 100 / row.cells.length;
          row.cells.forEach((cell, ci) => {
            const x1 = ci * cellW, x2 = (ci + 1) * cellW, y1 = ri * cellH, y2 = (ri + 1) * cellH;
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', `M${x1} ${y1} L${x1} ${y2} L${x2} ${y2} L${x2} ${y1} Z`);
            path.setAttribute('class', 'belly-area');
            path.setAttribute('data-sub', cell);
            bellySvg.appendChild(path);
          });
        });

        // 구역을 터치해 선택/해제 (여러 곳 선택 가능), 확인을 누를 때 대기열로 저장
        let selectedQueue = null;
        const updateQueue = () => {
          // 현재 선택된 구역을 기준으로 Queue 생성
          const allActive = [];
          document.querySelectorAll('.belly-area').forEach(el => {
              if (el.classList.contains('highlight') || el.classList.contains('highlight-danger')) {
                  allActive.push(el.getAttribute('data-sub'));
              }
          });
          // 고른 칸을 바로 저장 (🌐 언어 바꾸기로 다시 불러와도, step2에서 돌아와도 남게)
          cur.sub.pickedAreas = allActive;
          saveState(state);

          if (allActive.length > 0) {
              const totalCells = BELLY_ROWS.reduce((n, row) => n + row.cells.length, 0);
              // areas: 실제로 고른 구역 (묶어서 보여줘도 오른쪽 아래 확인용으로 남김)
              if (allActive.length === totalCells) {
                 selectedQueue = [{ id: 'belly_all', name: '복부 전체', lookupPart: '배', areas: allActive }];
              } else {
                 // 줄마다 하나로 묶음: 한 칸이면 그 칸 이름, 줄 전체면 '윗배 전체' 등, 일부(중고등 3칸 중 2칸)면 고른 칸을 나열
                 selectedQueue = [];
                 BELLY_ROWS.forEach(row => {
                   const rowAreas = row.cells.filter(c => allActive.includes(c));
                   if (rowAreas.length === 0) return;
                   if (rowAreas.length === 1) {
                     selectedQueue.push({ id: rowAreas[0], name: rowAreas[0], lookupPart: row.lookup, areas: rowAreas });
                   } else if (rowAreas.length === row.cells.length) {
                     selectedQueue.push({ id: row.allId, name: row.allName, lookupPart: row.lookup, areas: rowAreas });
                   } else {
                     selectedQueue.push({ id: row.multiId, name: row.multiId, lookupPart: row.lookup, areas: rowAreas });
                   }
                 });
              }
              document.getElementById('btn-belly-done').style.display = 'block';
          } else {
              selectedQueue = null;
              document.getElementById('btn-belly-done').style.display = 'none';
          }
        };

        document.querySelectorAll('.belly-area').forEach(el => {
          el.addEventListener('click', () => {
            const sub = el.getAttribute('data-sub');
            if (el.classList.contains('highlight') || el.classList.contains('highlight-danger')) {
              el.classList.remove('highlight', 'highlight-danger');
            } else {
              el.classList.add(sub === 'belly_right_bottom' ? 'highlight-danger' : 'highlight');
            }
            updateQueue();
          });
        });

        // 저장해 둔 선택 되살리기
        const picked = cur.sub.pickedAreas || [];
        if (picked.length > 0) {
          document.querySelectorAll('.belly-area').forEach(el => {
            const sub = el.getAttribute('data-sub');
            if (picked.includes(sub)) el.classList.add(sub === 'belly_right_bottom' ? 'highlight-danger' : 'highlight');
          });
          updateQueue();
        }

        document.getElementById('btn-belly-done').onclick = () => {
          if (selectedQueue && selectedQueue.length > 0) {
            restartRound(cur);
            cur.queue = selectedQueue;
            saveState(state);
            window.location.href = 'step2.html';
          }
        };
      } else {
        window.location.href = 'step2.html';
      }

      // I don't know button
      document.querySelector('.btn-idk').addEventListener('click', () => {
        if (cur.part === translations.ko['part_head']) {
          restartRound(cur);
          cur.sub.headSub = true;
        } else if (cur.part === translations.ko['part_belly']) {
          restartRound(cur);
          // 이름은 '배 (어딘지 모름)'으로 (부위 이름이 '잘 모르겠어요'로 바뀌지 않게)
          cur.queue = [{ id: 'idk', name: '배 (어딘지 모름)', lookupPart: '배' }];
        } else if (cur.sub.side) {
          if (!cur.sub.sideSelected) {
             cur.sub.sideSelected = true;
             cur.sub.sideLabel = translations.ko['idk'];
             cur.sub.legSide = 'idk';
             saveState(state);
             location.reload();
             return;
          } else {
             restartRound(cur);
             cur.sub.legSub = null;
             cur.part = legPartLabel(cur.sub.legSide, null);
          }
        }
        saveState(state);
        window.location.href = 'step2.html';
      });

      // 다리 부위의 한국어 이름 (보건실 화면·DB용): 모르는 쪽/부위는 '잘 모르겠어요'를 두 번 붙이지 않음
      function legPartLabel(side, subKey) {
        const sub = subKey ? translations.ko[subKey] : null;
        const sideLabel = { left: '왼쪽', right: '오른쪽', both: '양쪽' }[side] || null;
        if (sideLabel && sub) return `다리·발 (${sideLabel} ${sub})`;
        if (sideLabel) return `다리·발 (${sideLabel}, 부위 모름)`;
        if (sub) return `다리·발 (${sub}, 어느 쪽인지 모름)`;
        return '다리·발 (위치 모름)';
      }

      // Back Button
      document.getElementById('btn-back').addEventListener('click', () => {
        if (cur.sub.side && cur.sub.sideSelected) {
          cur.sub.sideSelected = false;
          cur.sub.sideLabel = null;
          cur.sub.legSide = null;
          cur.sub.legSub = null;
          saveState(state);
          location.reload();
        } else {
          window.location.href = 'step1.html';
        }
      });

      applyLanguageToUI();
    });
  </script>
</body>
</html>
