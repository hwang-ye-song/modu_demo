<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>그림 터치 문진표 - 언어 선택</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <style>
    .welcome-wrap {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
    }
    .welcome-icon {
      font-size: 4rem;
      line-height: 1;
    }
    .welcome-title {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
    }
    .lang-grid {
      width: 100%;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <section class="step active" style="position: relative;">
    <div class="welcome-wrap">
      <div class="welcome-icon">🏥</div>
      <h1 class="welcome-title" data-i18n="step_0_title">언어를 선택하세요</h1>
      <!-- 아직 언어를 고르기 전이므로 여러 언어로 짧게 안내 -->
      <p style="color: var(--text-sub); font-size: 0.95rem; text-align: center; margin-top: -1rem;">👆 언어를 고르세요 · Choose your language · 选择语言 · Выберите язык · Chọn ngôn ngữ · げんごを えらんでね · Piliin ang wika · <span lang="km">ជ្រើសរើសភាសា</span> · <span lang="th">เลือกภาษา</span> · <span lang="mn">Хэлээ сонгоно уу</span> · Tilni tanlang · <bdi lang="ar" dir="rtl">اختر اللغة</bdi></p>
      <div class="lang-grid">
        <button class="lang-btn" data-lang="ko"><span class="emoji">🇰🇷</span><span class="text">한국어</span></button>
        <button class="lang-btn" data-lang="zh"><span class="emoji">🇨🇳</span><span class="text">中文</span></button>
        <button class="lang-btn" data-lang="vi"><span class="emoji">🇻🇳</span><span class="text">Tiếng Việt</span></button>
        <button class="lang-btn" data-lang="ja"><span class="emoji">🇯🇵</span><span class="text">日本語</span></button>
        <button class="lang-btn" data-lang="tl"><span class="emoji">🇵🇭</span><span class="text">Tagalog</span></button>
        <button class="lang-btn" data-lang="km"><span class="emoji">🇰🇭</span><span class="text">ភាសាខ្មែរ</span></button>
        <button class="lang-btn" data-lang="th"><span class="emoji">🇹🇭</span><span class="text">ภาษาไทย</span></button>
        <button class="lang-btn" data-lang="mn"><span class="emoji">🇲🇳</span><span class="text">Монгол</span></button>
        <button class="lang-btn" data-lang="uz"><span class="emoji">🇺🇿</span><span class="text">O'zbek</span></button>
        <button class="lang-btn" data-lang="ru"><span class="emoji">🇷🇺</span><span class="text">Русский</span></button>
        <button class="lang-btn" data-lang="en"><span class="emoji">🇺🇸</span><span class="text">English</span></button>
        <button class="lang-btn" data-lang="ar"><span class="emoji">🇸🇦</span><span class="text">العربية</span></button>
      </div>
    </div>
    <button id="btn-nurse-lock" class="btn-icon nurse-lock-corner">🔒</button>
  </section>

  <script src="data.js"></script>
  <script src="db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      clearState();
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          let state = getState();
          state.lang = e.currentTarget.dataset.lang;
          saveState(state);
          window.location.href = 'step0_profile.html';
        });
      });
    });
  </script>
</body>
</html>
