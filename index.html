<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>그림 터치 문진표 - 언어 선택</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <style>
    .welcome-wrap {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
    }
    .welcome-icon {
      font-size: 4rem;
      line-height: 1;
    }
    .welcome-title {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
    }
    .lang-grid {
      width: 100%;
      max-width: 400px;
    }
    .welcome-sub {
      font-size: 1rem;
      color: var(--text-sub);
      font-weight: 500;
    }
    /* 학교급 버튼: 한 줄에 하나씩 크게 */
    .level-grid {
      grid-template-columns: 1fr;
    }
    .level-btn .text {
      text-align: start;
    }
    .level-back {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      min-height: unset;
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
    }
    .level-btn .text small {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-sub);
    }
  </style>
</head>
<body>
  <section class="step active" style="position: relative;">
    <!-- 1단계: 학교급 고르기 (초등: 언어를 먼저 고름 / 중고등: 한국어로 바로 시작, 위쪽 🌐로 언어 변경) -->
    <div class="welcome-wrap" id="level-wrap">
      <div class="welcome-icon">🏥</div>
      <h1 class="welcome-title">어느 학교에 다녀요?<br><span class="welcome-sub">Which school are you in?</span></h1>
      <div class="lang-grid level-grid">
        <button class="lang-btn level-btn" data-level="elem"><span class="emoji">🎒</span><span class="text">초등학교<small>Elementary school</small></span></button>
        <button class="lang-btn level-btn" data-level="secondary"><span class="emoji">🏫</span><span class="text">중학교 · 고등학교<small>Middle · High school</small></span></button>
      </div>
    </div>

    <!-- 2단계 (초등만): 언어 고르기 -->
    <div class="welcome-wrap hidden" id="lang-wrap">
      <!-- 학교급을 잘못 골랐을 때 되돌아가기 -->
      <button type="button" id="btn-level-back" class="btn btn-secondary level-back">◀ 이전 · Back</button>
      <div class="welcome-icon">🏥</div>
      <h1 class="welcome-title" data-i18n="step_0_title">언어를 선택하세요</h1>
      <!-- 아직 언어를 고르기 전이므로 여러 언어로 짧게 안내 -->
      <p style="color: var(--text-sub); font-size: 0.95rem; text-align: center; margin-top: -1rem;">👆 언어를 고르세요 · Choose your language · 选择语言 · Выберите язык · Chọn ngôn ngữ · げんごを えらんでね · Piliin ang wika · <span lang="km">ជ្រើសរើសភាសា</span> · <span lang="th">เลือกภาษา</span> · <span lang="mn">Хэлээ сонгоно уу</span> · Tilni tanlang · <bdi lang="ar" dir="rtl">اختر اللغة</bdi></p>
      <div class="lang-grid">
        <button class="lang-btn" data-lang="ko"><span class="emoji">🇰🇷</span><span class="text">한국어</span></button>
        <button class="lang-btn" data-lang="zh"><span class="emoji">🇨🇳</span><span class="text">中文</span></button>
        <button class="lang-btn" data-lang="vi"><span class="emoji">🇻🇳</span><span class="text">Tiếng Việt</span></button>
        <button class="lang-btn" data-lang="ja"><span class="emoji">🇯🇵</span><span class="text">日本語</span></button>
        <button class="lang-btn" data-lang="tl"><span class="emoji">🇵🇭</span><span class="text">Tagalog</span></button>
        <button class="lang-btn" data-lang="km"><span class="emoji">🇰🇭</span><span class="text">ភាសាខ្មែរ</span></button>
        <button class="lang-btn" data-lang="th"><span class="emoji">🇹🇭</span><span class="text">ภาษาไทย</span></button>
        <button class="lang-btn" data-lang="mn"><span class="emoji">🇲🇳</span><span class="text">Монгол</span></button>
        <button class="lang-btn" data-lang="uz"><span class="emoji">🇺🇿</span><span class="text">O'zbek</span></button>
        <button class="lang-btn" data-lang="ru"><span class="emoji">🇷🇺</span><span class="text">Русский</span></button>
        <button class="lang-btn" data-lang="en"><span class="emoji">🇺🇸</span><span class="text">English</span></button>
        <button class="lang-btn" data-lang="ar"><span class="emoji">🇸🇦</span><span class="text">العربية</span></button>
      </div>
    </div>
    <button id="btn-nurse-lock" class="btn-icon nurse-lock-corner">🔒</button>
  </section>

  <script src="data.js"></script>
  <script src="db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      clearState();
      // 앞 학생이 고른 언어(아랍어 오른쪽 정렬 등)가 남지 않게 지운 상태로 다시 적용
      applyLanguageToUI();
      document.querySelectorAll('.level-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const level = e.currentTarget.dataset.level;
          let state = getState();
          state.level = level;
          if (level === 'secondary') {
            // 중고등: 한국어로 바로 시작 (필요한 학생만 위쪽 🌐 버튼으로 바꿈)
            state.lang = 'ko';
            saveState(state);
            window.location.href = 'step0_profile.html';
          } else {
            // 초등: 지금처럼 언어를 먼저 고름
            saveState(state);
            document.getElementById('level-wrap').classList.add('hidden');
            document.getElementById('lang-wrap').classList.remove('hidden');
          }
        });
      });
      document.getElementById('btn-level-back').addEventListener('click', () => {
        clearState();
        document.getElementById('lang-wrap').classList.add('hidden');
        document.getElementById('level-wrap').classList.remove('hidden');
      });
      document.querySelectorAll('.lang-btn[data-lang]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          let state = getState();
          state.lang = e.currentTarget.dataset.lang;
          saveState(state);
          window.location.href = 'step0_profile.html';
        });
      });
    });
  </script>
</body>
</html>
