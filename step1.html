<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>그림 터치 문진표 - 어디가 아파요?</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* 몸 그림이 남는 높이를 모두 씁니다. 그림 상자는 그림 비율 그대로라 누르는 영역(SVG)과 어긋나지 않습니다. */
    /* 디자인 A: 그림 둘레를 연한 하늘색 상자로 감쌈 (누르는 영역 상자는 그대로라 위치가 어긋나지 않음) */
    .body-map-area {
      flex: 1 1 0;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      container-type: size;
      padding: 0.9rem;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at 50% 45%, var(--sky-soft) 0, #DCEEF8 75%);
      border: 2px solid var(--sky);
    }
    .body-map-container {
      position: relative;
      aspect-ratio: 756 / 1660;
      width: min(100%, calc((100dvh - 330px) * 0.4554)); /* 컨테이너 단위를 모르는 브라우저용 */
      width: min(100cqw, 100cqh * 0.4554);
    }
    .body-map-container img {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      user-select: none;
      filter: saturate(1.3) brightness(0.94); /* 하늘 바탕 위에서 그림이 잘 보이게 살짝 진하게 */
    }
    /* 몸 전체·피부·등허리 버튼: 흰 알약 모양. 좁은 화면에서는 두 줄로 넘기고 글자는 한 줄로 */
    .whole-body-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0.85rem 0 0.25rem;
      flex-shrink: 0;
    }
    .symptom-card.whole-body-btn {
      flex-direction: row;
      min-height: var(--tap);
      padding: 0.5rem 1.15rem;
      border-radius: var(--radius-pill);
      gap: 0.45rem;
      white-space: nowrap;
      color: var(--ink);
    }
    .symptom-card.whole-body-btn .text { font-family: var(--font-display); font-weight: 400; }
    .symptom-card.whole-body-btn .emoji { font-size: 1.5rem; margin: 0; }
    @media (min-width: 700px) {
      .whole-body-row { gap: 0.75rem; }
      .symptom-card.whole-body-btn { min-height: 72px; padding: 0.5rem 2.25rem; }
      .symptom-card.whole-body-btn .emoji { font-size: 2rem; }
      .symptom-card.whole-body-btn .text { font-size: 1.4rem; }
    }
    /* 가로로 넓은 태블릿: 시안 2번처럼 왼쪽 몸 그림, 오른쪽 부위 버튼 목록 + 다음 버튼 */
    @media (min-width: 900px) and (orientation: landscape) {
      .step {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, 340px);
        grid-template-rows: auto minmax(0, 1fr) auto;
        column-gap: 1.5rem;
        max-width: 1000px;
        padding-bottom: 1.25rem;
      }
      .step > h1 { grid-column: 1 / -1; }
      .body-map-area { grid-column: 1; grid-row: 2 / 4; min-height: 0; height: 100%; }
      .whole-body-row {
        grid-column: 2; grid-row: 2;
        flex-direction: column;
        flex-wrap: nowrap;
        justify-content: center;
        padding: 0;
      }
      .symptom-card.whole-body-btn { width: 100%; justify-content: flex-start; padding: 0.5rem 1.5rem; }
      #done-row { grid-column: 2; grid-row: 3; position: static; background: none; padding: 0.75rem 0 0; }
    }
  </style>
</head>
<body>
  <header>
    <button class="btn btn-secondary" onclick="window.location.href='step0_profile.html'">
      <span class="icon">◀</span> <span class="text" data-i18n="btn_prev">이전</span>
    </button>
    <div id="progress-bar"><div id="progress-fill" style="width: 20%;"></div><span id="progress-text">1 / 5</span></div>
    <button id="btn-nurse-lock" class="btn-icon">🔒</button>
  </header>

  <section class="step active">
    <h1 class="speakable"><span data-i18n="step_1_title">어디가 아파요?</span><button class="btn-speaker">🔊</button></h1>

    <!-- Body Map Interface -->
    <div class="body-map-area">
      <div class="body-map-container">
        <img src="body_map.png" alt="" draggable="false" />
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;">
        <style>
            .body-area { fill: transparent; cursor: pointer; transition: fill 0.2s; }
            .body-area:hover, .body-area:active, .body-area.hover-highlight { fill: rgba(232, 121, 74, 0.30); }
            .body-area.highlight { fill: rgba(232, 121, 74, 0.42); stroke: var(--peach-deep); stroke-width: 0.5; } /* 디자인 A: 누른 곳은 진한 복숭아색 */
          </style>
        <!-- 머리 및 목 -->
        <polygon points="43.4,2.2 39.7,4.1 38.6,8.9 39.2,11.3 41.8,12.8 42.3,15.9 40.7,17.1 34.4,18.1 33.9,19.0 67.2,19.0 67.2,18.3 60.3,16.6 58.2,14.9 58.2,12.8 61.4,10.6 60.8,4.1 55.6,1.7 45.5,1.7" class="body-area" data-part="part_head" />
        <!-- 가슴 -->
        <polygon points="24.9,20.7 24.3,41.2 29.1,41.2 32.3,35.4 31.7,41.2 68.8,41.2 68.3,34.9 70.9,40.7 75.1,41.2 75.1,20.2 68.3,18.6 33.3,18.6" class="body-area" data-part="part_chest" />
        <!-- 배 -->
        <polygon points="31.2,41.0 31.2,43.9 29.1,48.0 29.6,55.2 72.0,55.2 72.0,49.2 68.8,40.7" class="body-area" data-part="part_belly" />
        <!-- 양팔 -->
        <polygon points="25.4,22.7 23.3,23.1 21.7,34.2 18.0,38.8 12.2,51.6 3.7,54.9 4.8,56.1 8.5,55.9 8.5,60.0 11.1,61.0 15.9,60.7 16.4,59.0 19.6,59.3 20.1,51.6 25.4,46.0" class="body-area" data-part="part_arm" />
        <polygon points="74.1,20.5 74.1,44.6 81.5,52.0 82.5,59.0 84.7,59.5 85.2,60.7 89.9,61.0 91.0,60.0 93.1,60.0 93.1,56.1 96.8,56.1 96.8,54.9 89.4,51.6 86.2,47.5 83.6,39.5 79.4,33.5 78.3,22.9 76.2,20.5" class="body-area" data-part="part_arm" />
        <!-- 양다리 -->
        <polygon points="50.3,54.7 30.2,54.7 33.9,66.0 32.8,77.3 34.9,87.0 28.0,94.9 30.2,96.6 37.6,97.3 39.7,96.4 42.9,88.4 45.0,71.6 47.1,69.6" class="body-area" data-part="part_leg" />
        <polygon points="49.2,54.7 49.2,57.6 52.4,58.3 65.6,96.4 68.3,98.6 75.1,97.6 75.1,92.3 69.8,86.7 70.9,73.0 68.8,70.1 72.0,54.7" class="body-area" data-part="part_leg" />
      </svg>
    </div>
    </div>
    
    <!-- 온몸이 아파요 (몸 전체), 그림에서 고를 수 없는 피부·등/허리 버튼 -->
    <div class="whole-body-row">
      <button class="symptom-card whole-body-btn" data-part="part_whole">
        <span class="emoji">🤒</span>
        <span class="text" data-i18n="part_whole">몸 전체</span>
      </button>
      <button class="symptom-card whole-body-btn" data-part="part_skin">
        <span class="emoji">🩹</span>
        <span class="text" data-i18n="part_skin">피부</span>
      </button>
      <button class="symptom-card whole-body-btn" data-part="part_back">
        <span class="emoji">🧍</span>
        <span class="text" data-i18n="part_back">등·허리</span>
      </button>
    </div>

    <!-- 다른 곳도 아파요로 온 경우: 더 고를 곳이 없으면 다음 단계로 -->
    <div id="parts-done-wrap" class="step-actions hidden" style="justify-content: center; margin-top: 0;">
      <button id="btn-parts-done" class="btn btn-primary"><span class="text" data-i18n="btn_parts_done">다 골랐어요</span> <span class="icon">▶</span></button>
    </div>
  </section>

  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 앞에서 끝낸 부위가 있으면 '다 골랐어요' 버튼으로 언제/알레르기 단계로 돌아갈 수 있게
      const startState = getState();
      if (startState.visit && startState.visit.entries && startState.visit.entries.length > 0) {
        document.getElementById('parts-done-wrap').classList.remove('hidden');
        document.getElementById('btn-parts-done').addEventListener('click', () => {
          const st = getState();
          st.current = null;
          saveState(st);
          window.location.href = 'step4.html';
        });
      }

      document.querySelectorAll('.symptom-card, .body-area').forEach(btn => {
        btn.addEventListener('mouseenter', (e) => {
          const partKey = e.currentTarget.dataset.part;
          if (partKey === 'part_arm' || partKey === 'part_leg') {
            document.querySelectorAll(`.body-area[data-part="${partKey}"]`).forEach(el => el.classList.add('hover-highlight'));
          }
        });
        
        btn.addEventListener('mouseleave', (e) => {
          const partKey = e.currentTarget.dataset.part;
          if (partKey === 'part_arm' || partKey === 'part_leg') {
            document.querySelectorAll(`.body-area[data-part="${partKey}"]`).forEach(el => el.classList.remove('hover-highlight'));
          }
        });

        btn.addEventListener('click', (e) => {
          let state = getState();
          const partKey = e.currentTarget.dataset.part;

          // 새 회차 시작 (끝내지 못한 회차는 버리고, 앞에서 끝낸 기록 state.visit은 그대로)
          state.current = newRound(translations.ko[partKey] || partKey);

          // 팔은 팔 그림, 다리·머리·배는 세부 부위 화면, 나머지(가슴·몸 전체)는 바로 증상 선택
          // 배: 중고등만 9칸 화면, 초등은 나누지 않고 '배' 하나로 (보건교사 종이 문진표처럼 부위만)
          let next = 'step2.html';
          if (partKey === 'part_arm') {
            next = 'step1_arm.html';
          } else if (partKey === 'part_leg') {
            state.current.sub.side = 'leg';
            next = 'step1_sub.html';
          } else if (partKey === 'part_head' || (partKey === 'part_belly' && state.level === 'secondary')) {
            next = 'step1_sub.html';
          }
          saveState(state);
          window.location.href = next;
        });
      });
    });
  </script>
</body>
</html>
