<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>그림 터치 문진표 - 제출 확인</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <style>
    .entry-summary {
      border: 2px solid var(--secondary);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1rem;
      background: #FAFAFA;
    }
    .popup-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .popup-content {
      background: white; padding: 2rem; border-radius: 16px; text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15); transform: translateY(20px); transition: transform 0.3s;
    }
    .popup-overlay.show { opacity: 1; pointer-events: auto; }
    .popup-overlay.show .popup-content { transform: translateY(0); }
    .entry-summary h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <header>
    <button id="btn-back" class="btn btn-secondary">
      <span class="icon">◀</span> <span class="text" data-i18n="btn_prev">이전</span>
    </button>
    <div id="progress-bar"><div id="progress-fill" style="width: 100%;"></div><span id="progress-text">5 / 5</span></div>
    <button id="btn-nurse-lock" class="btn-icon">🔒</button>
  </header>

  <section class="step active">
    <h1 class="speakable"><span data-i18n="step_5_title">이대로 보낼까요?</span><button class="btn-speaker">🔊</button></h1>
    <div id="summary-container" class="summary-card">
      <!-- Generated by JS -->
    </div>
    <div class="step-actions">
      <!-- 삭제요청: 다른 곳도 아파요 / 새로 작성하기 버튼 제거 -->
      <button id="btn-submit" class="btn btn-primary btn-pulse" data-i18n="btn_submit">맞아요 (보내기)</button>
    </div>
  </section>

  <div id="success-popup" class="popup-overlay">
    <div class="popup-content">
      <div style="font-size: 4rem; margin-bottom: 1rem;">✅</div>
      <h2 style="color: var(--primary); margin-bottom: 0.5rem;" data-i18n="popup_success">전달 완료!</h2>
      <p style="color: var(--text-sub);" data-i18n="popup_desc">선생님께 전달되었습니다.</p>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let state = getState();
      
      document.getElementById('btn-back').addEventListener('click', () => {
        window.location.href = 'step4_allergy.html';
      });

      // 끝낸 부위 기록 전체 (앞 회차 + 이번 회차)
      const list = allEntries(state);
      if (list.length === 0) { window.location.href = 'step1.html'; return; }

      const container = document.getElementById('summary-container');

      // DB entries_json 형태로 바꿈
      const entries = list.map((r, idx) => {
          // '잘 모르겠어요'로 고른 배·팔은 위치가 아니므로 bellyPos 없음 (이름표만 '배 (어딘지 모름)')
          const isIdk = r.partObj.id === 'idk';
          const bellyPos = !isIdk && r.partObj.name !== r.partObj.lookupPart ? r.partObj.name : null;
          const areas = r.partObj.areas || [];
          // 묶음 이름(윗배 전체, 왼쪽 팔 여러 부위 등)이 실제로 고른 구역과 다르면 고른 구역을 그대로 나열
          // (복부 전체·팔 전체, 윗배/아랫배 두 칸을 다 고른 경우는 묶음 이름이 정확하므로 그대로)
          const isFullGroup = /_all$/.test(r.partObj.id) && (r.partObj.id === 'belly_all' || /^arm_/.test(r.partObj.id) || areas.length === 2);
          const listAreas = bellyPos && areas.length > 0 && !isFullGroup && !(areas.length === 1 && areas[0] === bellyPos);
          return {
              part: r.partObj.lookupPart,
              bellyPos: bellyPos,
              // 보건실 화면·AI용 한국어 위치 이름 (bellyPos는 응급 판단에 쓰므로 그대로 둠)
              partLabel: isIdk ? '어딘지 모름' : (bellyPos ? (listAreas ? areas.map(a => translations.ko[a] || a).join(', ') : (translations.ko[bellyPos] || bellyPos)) : null),
              areas: areas,
              symptoms: r.symptoms,
              painLevels: r.painLevels,
              startTimes: r.startTimes || {},
              traumaCauses: r.traumaCauses || {},
              headQ: r.headQ === undefined ? null : r.headQ,
              // 추가 질문은 모든 부위 공통이므로 첫 번째 기록에만 저장
              followups: idx === 0 ? (state.visit.followups || []) : []
          };
      });


      const lang = state.lang || 'ko';
      const t = translations[lang] || translations.ko;
      container.innerHTML = entries.map((e, idx) => {
        // 부위 이름은 고른 부위 정보(partObj)로 학생 언어에 맞게 만듦
        const translatedPart = escapeHtml(partDisplayName(list[idx].partObj, lang));

        const symptomDetails = e.symptoms.map(s => {
           const tSym = translateSymptom(s, e.part, lang);
           const pain = (e.painLevels && e.painLevels[s]) || '0';
           const timeKeyStr = e.startTimes && e.startTimes[s] ? e.startTimes[s] : "잘 모르겠어요";
           const tTime = translateKoToLang(timeKeyStr, lang);
           // 다친 이유도 함께 보여 줌
           const cause = e.traumaCauses && e.traumaCauses[s] ? ` - ${t.summary_hurt_how}: ${translateKoToLang(e.traumaCauses[s], lang)}` : '';
           return `${escapeHtml(tSym)} (${escapeHtml(pain)}/10, ${escapeHtml(tTime)})${escapeHtml(cause)}`;
        }).join('<br>');

        let itemsHTML = `
          <div class="summary-item"><strong>${t.summary_part}:</strong> <span>${translatedPart}</span></div>
          <div class="summary-item"><strong>${t.summary_symptom_label}:</strong> <span>${symptomDetails}</span></div>
        `;
        // 머리를 다쳤을 때 물어본 '어지럽거나 토할 것 같아요?' 답
        if (e.headQ === true || e.headQ === false) {
          itemsHTML += `<div class="summary-item"><strong>${escapeHtml(t.summary_head_q)}</strong> <span>${escapeHtml(e.headQ ? t.yes : t.no)}</span></div>`;
        }
        return `<div class="entry-summary"><h3>${t.summary_symptom} ${idx + 1}</h3>${itemsHTML}</div>`;
      }).join('');

      // 추가 질문(밥/약/구토)은 어느 한 부위가 아니라 방문 전체에 대한 답이므로 따로 보여 줌
      const visitFollowups = state.visit.followups || [];
      if (visitFollowups.length) {
        const rows = visitFollowups.map(f => {
          const translatedQ = translateKoToLang(f.q, lang);
          const translatedA = translateKoToLang(f.a, lang) || f.a;
          return `<div class="summary-item"><strong>${escapeHtml(translatedQ)}</strong> <span>${escapeHtml(translatedA)}</span></div>`;
        }).join('');
        container.innerHTML += `<div class="entry-summary"><h3>${escapeHtml(t.summary_more_info)}</h3>${rows}</div>`;
      }


      // Add medication info
      if (state.visit.medications && state.visit.medications.length > 0) {
        const lang = state.lang || 'ko';
        const t = translations[lang] || translations.ko;
        const medLabels = state.visit.medications.map(m => escapeHtml(translateKoToLang(translations.ko[m] || m, state.lang))).join(', ');
        container.innerHTML += `<div class="entry-summary"><h3>${t.summary_med_info || '💊 복용 중인 약'}</h3><div class="summary-item"><strong>${t.summary_med_label || '복용 약'}:</strong> <span>${medLabels}</span></div></div>`;
      }

      // Add allergy info (shared across all entries)
      if (state.visit.allergies && state.visit.allergies.length > 0) {
        const lang = state.lang || 'ko';
        const t = translations[lang] || translations.ko;
        const customLabels = state.visit.customAllergyLabels || {};
        const allergyLabels = state.visit.allergies.map(a => {
           // 음성으로 추가한 알레르기: 학생 언어 이름 (없으면 한국어)
           if (a.startsWith('custom_')) return escapeHtml(customLabels[a] || a.substring(7)); // "custom_새우" -> "새우"
           return escapeHtml(translateKoToLang(translations.ko[a] || a, state.lang));
        }).join(', ');
        container.innerHTML += `<div class="entry-summary"><h3>${t.summary_allergy_info}</h3><div class="summary-item"><strong>${t.summary_allergy_label}:</strong> <span>${allergyLabels}</span></div></div>`;
      }

      // btn-restart 이벤트 리스너 제거 완료

      document.getElementById('btn-submit').addEventListener('click', (e) => {
        // 두 번 눌러 같은 기록이 중복 저장되지 않도록 한 번만 처리
        const submitBtn = e.currentTarget;
        if (submitBtn.disabled) return;
        submitBtn.disabled = true;

        const flags = evaluateEmergency(entries, state.visit.followups || []);
        const finalEntries = entries;

        // DB 스키마 에러 방지: allergies를 별도 컬럼이 아닌 entries_json 내부에 저장
        if (finalEntries.length > 0) {
          finalEntries[0].allergies = state.visit.allergies || [];
          finalEntries[0].medications = state.visit.medications || [];
        }

        // 로컬 큐에 추가 (db.js가 백그라운드에서 처리함)
        const queue = JSON.parse(localStorage.getItem('sync_queue') || '[]');
        queue.push({
          // 큐에서 이 기록만 골라 지우기 위한 번호 (DB 컬럼이 아니라 db.js가 보내기 전에 뺌)
          local_id: (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2),
          lang: state.lang,
          grade: state.visit.grade,
          class_num: state.visit.class_num,
          student_num: state.visit.student_num,
          entries_json: finalEntries,
          emergency_flags: Array.from(flags),
          created_at: new Date().toISOString(),
          is_resolved: false
        });
        localStorage.setItem('sync_queue', JSON.stringify(queue));
        clearState(); // 뒤로 가기로 같은 문진표가 다시 제출되지 않도록 바로 초기화

        // 팝업 띄우기
        const popup = document.getElementById('success-popup');
        popup.classList.add('show');

        // 1.5초 후 처음 화면으로 이동
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      });
    });
  </script>
</body>
</html>
